name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Explicit, not relying solely on package.json's `packageManager`
          # field — pnpm/action-setup#225/#227 report v6 sometimes ignoring
          # that field.
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm exec fallow audit --format github-annotations

      - run: pnpm exec playwright install --with-deps

      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
