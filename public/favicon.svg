<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- kanvy: a heavy "k" on a solid rounded tile, in the app's Nord
       palette (nord0 tile, nord8 glyph). Kept deliberately simple so it
       stays legible at 16px in a browser tab. -->
  <title>kanvy</title>
  <rect width="32" height="32" rx="8" fill="#2e3440" />
  <text
    x="16"
    y="24"
    text-anchor="middle"
    font-family="system-ui,sans-serif"
    font-size="22"
    font-weight="900"
    fill="#88c0d0"
  >k</text>
</svg>
